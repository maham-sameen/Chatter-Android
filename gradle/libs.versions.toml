[versions]
agp = "9.0.1"
kotlin = "2.2.21"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.12.0"
composeBom = "2025.11.01"


#feature_contacts
country-picker = "1.0.4"
core = "3.5.4"
cameraCamera2 = "1.5.1"
libphonenumber = "9.0.18"


#koin
koin-bom = "4.1.1"


#room
room = "2.8.4"

#ksp
ksp-version = "2.3.2"

#firebase
firebaseBom = "34.6.0"

#ktor
ktor-version = "3.3.2"

#mongo db
mongodbDriverKotlinCoroutine = "5.6.1"


#coil
coilCompose = "3.3.0"

#stream
startupRuntime = "1.2.0"
stream = "1.16.0"
streamAndroidPushFirebase = "1.3.2"



#datastore
datastorePreferences = "1.2.0"
tinkAndroid = "1.19.0"
kotlinx-serialization-protobuf = "1.9.0"



#worker
workRuntimeKtx = "2.11.0"

#for security hashing
commonsCodec = "1.20.0"
lifecycleProcess = "2.10.0"




[libraries]



androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-startup-runtime = { module = "androidx.startup:startup-runtime", version.ref = "startupRuntime" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }



#feature_contacts
country-picker-kmp = { module = "com.stevdza-san:countrypicker", version.ref = "country-picker" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "cameraCamera2" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "cameraCamera2" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "cameraCamera2" }
core = { module = "com.google.zxing:core", version.ref = "core" }
#phone number validation
libphonenumber = { module = "com.googlecode.libphonenumber:libphonenumber", version.ref = "libphonenumber" }






#koin
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin-bom" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-ktor = {module = "io.insert-koin:koin-ktor"}
koin-slf4j-logger = {module = "io.insert-koin:koin-logger-slf4j"}
# app start up
koin-androidx-startup= {module = "io.insert-koin:koin-androidx-startup" , version.ref = "koin-bom"}
#view model
koin-compose-viewmodel = {module = "io.insert-koin:koin-compose-viewmodel" , version.ref = "koin-bom"}
#view model with navigation
koin-compose-viewmodel-navigation = {module = "io.insert-koin:koin-compose-viewmodel-navigation" , version.ref = "koin-bom"}




#room
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }


#firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
firebase-storage = { module = "com.google.firebase:firebase-storage" }
firebase-ai = { module = "com.google.firebase:firebase-ai" }



#ktor
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor-version" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor-version" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor-version" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor-version" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor-version" }
ktor-client-content-negotiation = {module = "io.ktor:ktor-client-content-negotiation" , version.ref = "ktor-version"}


#mongo db
mongodb-driver-kotlin-coroutine = { module = "org.mongodb:mongodb-driver-kotlin-coroutine", version.ref = "mongodbDriverKotlinCoroutine" }



#coil
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coilCompose" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coilCompose" }


#stream
stream-android-push-firebase = { module = "io.getstream:stream-android-push-firebase", version.ref = "streamAndroidPushFirebase" }
stream-video = { module = "io.getstream:stream-video-android-core", version.ref = "stream" }
stream-video-android-ui-compose = { module = "io.getstream:stream-video-android-ui-compose", version.ref = "stream" }


#datastore
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }
#tink = { module = "com.google.crypto.tink:tink", version.ref = "tink" }
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tinkAndroid" }
kotlinx-serialization-protobuf = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf", version.ref = "kotlinx-serialization-protobuf" }




#worker
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "workRuntimeKtx" }
koin-androidx-workmanager = { module = "io.insert-koin:koin-androidx-workmanager", version.ref = "koin-bom" }



#for security hashing
commons-codec = { module = "commons-codec:commons-codec", version.ref = "commonsCodec" }



#paging
paging-compose = { module = "androidx.paging:paging-compose", version = "3.3.6" }
room-paging = {module = "androidx.room:room-paging" , version = "2.8.4"}
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycleProcess" }



[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }



#ksp
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp-version" }


#kotlinx serialization
kotlin-plugin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

#google service
google-services = {id = "com.google.gms.google-services", version= "4.4.4"}


[bundles]
stream = ["stream-video", "stream-video-android-ui-compose"]